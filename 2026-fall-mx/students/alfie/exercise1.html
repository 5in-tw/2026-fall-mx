<!doctype html>
<html lang="en">

<head>
  <title>Exercise 1</title>
  <link rel="stylesheet" href="/2026-fall-mx/styles/shared.css" />
  <link rel="stylesheet" href="./styles/styles.css" />
  <link rel="stylesheet" href="./styles/exercise1.css" />

  <link rel="icon" href="/2026-fall-mx/favicon.png" />
  <meta name="color-scheme" content="light dark" />
</head>

<body>
  <header class="header">
    <div class="center line">
      <div class="big line">
        <img src="/2026-fall-mx/images/logo-5in.png" alt="5in" width="80" />
        <b>5IN</b>
      </div>
      <menu class="line">
        <a href="/2026-fall-mx/students/me/">Home</a>
      </menu>
    </div>
  </header>


  <main class="center">
    <div class="headings">
      <h1><span>Excercise:</span></h1>
      <h2>CSS Selectors</h2>
    </div>


    <figure>
      <img src="">
      <figcaption>Beep</figcaption>
      <audio controls src="chime.mp3" id="beepSound"></audio>

      <button id="playBeep" class="play">
        <span class="play-circle">
          <span class="play-triangle"></span>
        </span>
        play</button>
    </figure>

    <figure>
      <figcaption>Clicky sound</figcaption>

      <audio src="/2026-fall-mx/media/keypress-1.mp3" controls id="click1"></audio>
      <audio src="/2026-fall-mx/media/keypress-2.mp3" controls id="click2"></audio>
      <audio src="/2026-fall-mx/media/keypress-3.mp3" controls id="click3"></audio>
      <button id="play-random">Play random</button>
    </figure>

    <p>
      <strong>#1:</strong> <abbr title="Cascasing Style Sheets">CSS</abbr> is fun!
    </p>

    <p>
      <strong>#2:</strong> <abbr title="HyperText Markup Language">HTML</abbr> is the structure of our website files.
    </p>

    <p>
      <strong>#3:</strong> <abbr title="JavaScript">JS</abbr> is powerful! And kind of hard. But we’ll keep learning!
    </p>

    <form id="snoopy">
      <h2>Snoopy Form</h2>
      <fieldset>
        <legend>Name:</legend>

        <label>
          <span>First name:</span>
          <input type="text" name="firstName">
        </label>

        <label>
          <span>Last name:</span>
          <input type="text" name="lastName">
        </label>
      </fieldset>

      <label>
        <span>Height:</span>
        <input type="number" name="height"> cm
      </label>

      <label>
        <span>Birthday:</span>
        <input type="date" name="birthday">
      </label>

      <div class="form-buttons">
        <input type="reset" value="Reset">
        <input type="submit" value="Submit">
      </div>
    </form>

    <p id="box-test">
      <span class="span1">Span #1</span>
      <span class="span2">Span #2</span>
      <span class="span3">Span #3</span>
      <span class="span4">Span #4</span>
      <span class="span5">Span #5</span>
    </p>

    <p class="bigSpace">
      <img class="spinMe"
        src="https://scontent-tpe1-1.cdninstagram.com/v/t51.82787-15/918166020_17912664711665188_6264451926927045010_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=101&_nc_map=urlgen_bucketless&ig_cache_key=NDAzNjExOTQ5NzU3MTk3NjE1MA%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=5ikmlsR4mBIQ7kNvwELHR4h&_nc_oc=Adq_qJcnGTPXWrcsaZOfzRd70G1YLr_Lw9w_PZiEEp3vy5ytTWfTp4E88re-PpX1BWUIGt3dmivKjDVrak9tLOnY&_nc_zt=23&_nc_ht=scontent-tpe1-1.cdninstagram.com&_nc_gid=5uBY6QL8LNf71yPrWocF-w&_nc_ss=7b2a8&_nc_ct=RQosPBUIFQIlBAAAAA&oh=00_AQSPuGS7hXKWaQMGjST4LLBYFxHshoNKWfnJoazuzgkENQ&oe=6B094F58"
        alt="5in" width="900">
    </p>

  </main>

  <footer class="footer">
    <div class="center">
      <h2>Footer</h2>
      <p>Last updated: <span>2026 October 14</span></p>
      <p>
        Code:
        <a href="https://github.com/5in-tw/2026-fall-mixed">GitHub</a>
      </p>

      <form id="chooser-of-colors">
        <fieldset id="color-chooser">
          <legend>Color scheme</legend>
          <label>
            <input type="radio" name="color-scheme-choice" value="light" />
            Light
          </label>
          <label>
            <input type="radio" name="color-scheme-choice" value="light dark" checked />
            Auto
          </label>
          <label>
            <input type="radio" name="color-scheme-choice" value="dark" />
            Dark
          </label>
        </fieldset>
      </form>
    </div>
  </footer>

  <script src="scipts/color-scheme.js" type="module"></script>
  <script src="./scipts/exercise1.js" type="module"></script>
  <script src="./scipts/audio-test.js" type="module"></script>
</body>

</html>
