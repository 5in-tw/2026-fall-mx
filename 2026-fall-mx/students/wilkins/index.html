<!doctype html>
<html lang="en">
  <head>
    <title>Mr. Wilkins: 5IN’s Fall 2026 Mixed Grade</title>
    <link rel="stylesheet" href="/2026-fall-mx/styles/project.css" />
    <link rel="icon" href="/2026-fall-mx/favicon.png" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="header">
      <div class="center line">
        <div class="big line">
          <img src="/2026-fall-mx/images/logo-5in.png" alt="5in" width="80" />
          <b>5IN</b>
        </div>
        <menu class="line">
          <a href="/2026-fall-mx/">Home</a>
          <a href="/2026-fall-mx/#students">Students</a>
          <a href="/2026-fall-mx/#teachers">Teachers</a>
          <a href="/2026-fall-mx/#github">GitHub accounts</a>
          <!-- <button id="color-mode-button">Light mode</button> -->
        </menu>
      </div>
    </header>
    <main class="center">
      <h1>Homepage of Mr. Wilkins</h1>

      <fieldset>
        <legend>Color scheme</legend>
        <label>
          <input type="radio" name="color-scheme-choice" value="light" />
          Light
        </label>
        <label>
          <input
            type="radio"
            name="color-scheme-choice"
            value="light dark"
            checked
          />
          Auto
        </label>
        <label>
          <input type="radio" name="color-scheme-choice" value="dark" />
          Dark
        </label>
      </fieldset>
    </main>
    <footer class="footer">
      <div class="center">
        <p>Last updated: 2026 September 14</p>
        <p>
          Code:
          <a href="https://github.com/5in-tw/2026-fall-mixed">GitHub</a>
        </p>
      </div>
    </footer>
  </body>
</html>
